<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">QR Code Generator</h1>
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="mb-3">
                    <label for="text" class="form-label">Enter text or URL:</label>
                    <input type="text" id="text" class="form-control">
                </div>
                <div class="mb-3">
                    <button onclick="generateQRCode()" class="btn btn-primary ">Generate QR Code</button>
                </div>
                <div id="qrcode" style="max-width: 100ft;    "class="text-center p-3"></div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <!-- QRCode.js -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator/qrcode.js"></script>
    <script>
        function generateQRCode() {
            var text = document.getElementById("text").value;
            var typeNumber = 4; // QR Code type
            var errorCorrectionLevel = 'L'; // Error correction level
            var qr = qrcode(typeNumber, errorCorrectionLevel);
            qr.addData(text);
            qr.make();
            document.getElementById("qrcode").innerHTML = qr.createImgTag();
        }
    </script>
</body>
</html>
