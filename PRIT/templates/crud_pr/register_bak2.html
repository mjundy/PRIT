{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Purchase Request</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

<div class="container mt-4">
    <h2>Register Purchase Request</h2>
    <form method="POST" action="{% url 'register_pr' %}">
        {% csrf_token %}
        <table class="table table-bordered" id="prTable">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Tanggal PR</th>
                    <th>Part Number</th>
                    <th>Part Name</th>
                    <th>Qty</th>
                    <th>UOM</th>
                    <th>Deskripsi</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td><input type="date" name="tanggal_pr[]" class="form-control" required></td>
                    <td><input type="text" name="part_number[]" class="form-control" required></td>
                    <td><input type="text" name="part_name[]" class="form-control" required></td>
                    <td><input type="number" name="qty[]" class="form-control" required></td>
                    <td><input type="text" name="uom[]" class="form-control" required></td>
                    <td><input type="text" name="deskripsi[]" class="form-control"></td>
                    <td><input type="text" name="status[]" class="form-control"></td>
                    <td><button type="button" class="btn btn-danger remove-row">Delete</button></td>
                </tr>
            </tbody>
        </table>
        <button type="button" id="addRow" class="btn btn-success">Add Row</button>
        <input type="submit" class="btn btn-primary">Process Files</input>
    </form>
</div>

<script>
    $(document).ready(function(){
        $("#addRow").click(function(){
            var statusOptions = `{% for value, label in status_choices %}<option value="{{ value }}">{{ label }}</option>{% endfor %}`;
            var rowCount = $("#prTable tbody tr").length + 1;
            var newRow = `<tr>
                <td>${rowCount}</td>
                <td><input type="date" name="tanggal_pr[]" class="form-control" required></td>
                <td><input type="text" name="part_number[]" class="form-control" required></td>
                <td><input type="text" name="part_name[]" class="form-control" required></td>
                <td><input type="number" name="qty[]" class="form-control" required></td>
                <td><input type="text" name="uom[]" class="form-control" required></td>
                <td><input type="text" name="deskripsi[]" class="form-control"></td>
                <td>
                    <select name="status[]" class="form-control">` + statusOptions + `</select>
                </td>
                <td><button type="button" class="btn btn-danger remove-row">Delete</button></td>
            </tr>`;
            $("#prTable tbody").append(newRow);
        });

        $(document).on("click", ".remove-row", function(){
            $(this).closest("tr").remove();
        });
    });
</script>

</body>
</html>
